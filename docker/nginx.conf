server {
    listen 3007;
    server_name _;
    root /usr/share/nginx/html;

    # pdf.js, pdf-lib and the Inter TTFs are large and compress well.
    gzip on;
    gzip_types text/css text/javascript application/javascript application/wasm
               font/ttf font/woff2 image/svg+xml;
    gzip_min_length 1024;

    # nginx's default mime.types has no entry for .mjs, so it would be served
    # as application/octet-stream and the browser would REFUSE to execute it as
    # a module. That silently kills the pdf.js worker and makes every PDF fail
    # to open. A `types` block replaces the inherited map rather than extending
    # it, so it is scoped to a location that matches nothing but .mjs.
    location ~* \.mjs$ {
        types { text/javascript mjs; }
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # Vite content-hashes asset filenames, so they are safe to cache forever.
    # One Cache-Control header only: the `expires` directive would emit its
    # own and duplicate this.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location /fonts/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # index.html names the hashed assets. A cached copy survives a redeploy and
    # then points at files that no longer exist, producing a blank page for
    # anyone who visited before the deploy. It must always revalidate.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    location = /healthz {
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # SPA fallback.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
