services:
  app:
    image: pdf-editor:latest
    container_name: pdf-editor-app
    ports:
      - "${APP_PORT:-3007}:3007"
    environment:
      NGINX_ENTRYPOINT_QUIET_LOGS: "1"
    restart: unless-stopped
    healthcheck:
      # 127.0.0.1, not localhost: the image's /etc/hosts maps localhost to ::1
      # only, while nginx listens on IPv4, so "localhost" is refused and the
      # container is reported unhealthy while serving traffic perfectly.
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3007/healthz"]
      interval: 30s
      timeout: 3s
      retries: 3
